<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Session Manager</title>
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg" />
  <!-- Tokens first: every later stylesheet resolves its colours from them. -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/charts.css" />
  <link rel="stylesheet" href="css/journey.css" />
  <link rel="stylesheet" href="css/views.css" />
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar" role="banner">
      <button class="brand" data-action="nav" data-view="overview" title="Back to Overview">
        <img class="brand-mark" src="icons/logo.svg" alt="" aria-hidden="true" />
        <span class="brand-name">Session <span>Manager</span></span>
      </button>

      <nav id="view-rail" class="view-rail" aria-label="Views"></nav>

      <div class="top-search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" class="field" type="text" autocomplete="off" spellcheck="false"
          placeholder="Filter sessions · Enter searches all"
          aria-label="Filter sessions, or press Enter to search all history" />
        <kbd>Ctrl F</kbd>
      </div>

      <select id="agent-switch" class="picker" aria-label="Agent" title="Which agent's sessions to show">
        <option value="all">All agents</option>
        <option value="claude">Claude</option>
        <option value="codex">Codex</option>
      </select>
      <select id="source-switch" class="picker" aria-label="Environment"
        title="Environment to scan. WSL sources are opt-in for faster refreshes.">
        <option value="windows">Windows</option>
      </select>

      <div class="topbar-actions">
        <button id="command-trigger" class="btn sm" type="button" title="Open the command launcher (Ctrl+K)">
          Commands <kbd>Ctrl K</kbd></button>
        <button class="btn sm primary" type="button" data-action="launch-new"
          title="Start a new session in the selected or most recent project (Ctrl+N)">+ New</button>
        <div id="live-dot" class="live-dot" title="Watching local agent session data for changes">
          <span class="pulse"></span><span id="live-label">live</span></div>
        <button id="theme-toggle" class="icon-btn" type="button" title="Switch to the light theme"
          aria-label="Toggle theme">☀</button>
        <button id="refresh-btn" class="icon-btn" type="button" title="Refresh data (F5)" aria-label="Refresh">⟳</button>
        <button id="help-trigger" class="icon-btn" type="button" title="Keyboard shortcuts (?)"
          aria-label="Keyboard shortcuts">?</button>
        <span class="window-divider" aria-hidden="true"></span>
        <button id="win-min" class="icon-btn window-btn" type="button" title="Minimize" aria-label="Minimize">−</button>
        <button id="win-close" class="icon-btn window-btn win-close" type="button" title="Close" aria-label="Close">×</button>
      </div>
    </header>

    <div id="session-tabs" class="session-tabs" aria-label="Recently opened sessions"></div>

    <div class="body">
      <aside id="sidebar" class="sidebar" aria-label="Session browser"></aside>
      <div id="sidebar-grip" class="grip" role="separator" aria-orientation="vertical"
        aria-label="Resize the session browser" aria-valuemin="220" aria-valuemax="520" aria-valuenow="300"
        tabindex="0" title="Drag to resize · double-click to reset"></div>
      <main id="main-pane" class="main-pane" tabindex="-1"></main>
    </div>

    <footer class="statusbar" aria-label="Application status">
      <span id="status-scope">All projects</span>
      <span id="status-summary">Loading the session index…</span>
      <span class="spacer"></span>
      <button id="update-pill" class="update-pill" data-action="goto-update" hidden>Update available</button>
      <button data-action="toggle-sidebar" title="Toggle the sidebar (Ctrl+B)">Sidebar</button>
      <button data-action="show-shortcuts">Shortcuts</button>
      <span id="app-version">v0.0.0</span>
    </footer>
  </div>

  <div id="command-backdrop" class="backdrop" hidden>
    <section class="palette" role="dialog" aria-modal="true" aria-labelledby="palette-title">
      <div class="palette-input-row">
        <span class="prompt-mark" aria-hidden="true">&gt;</span>
        <input id="command-input" type="text" autocomplete="off" spellcheck="false"
          placeholder="Type a command, project, or session…" aria-label="Command launcher" />
        <kbd>Esc</kbd>
      </div>
      <div class="palette-meta">
        <span id="palette-title">Command launcher</span>
        <span>Enter to run · ↑↓ to navigate</span>
      </div>
      <div id="command-results" class="command-results" role="listbox"></div>
    </section>
  </div>

  <div id="shortcut-backdrop" class="backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="shortcut-title">
      <div class="dialog-head">
        <div><div class="eyebrow">Reference</div><h2 id="shortcut-title">Keyboard shortcuts</h2></div>
        <button class="icon-btn" data-action="close-shortcuts" aria-label="Close">×</button>
      </div>
      <div id="shortcut-grid" class="shortcut-grid"></div>
      <div class="dialog-foot">Shortcuts pause while you are editing text. Press <kbd>Esc</kbd> to close dialogs.</div>
    </section>
  </div>

  <!-- Classic scripts, loaded in dependency order. Not ES modules: the page is
       loaded from file:// inside QtWebEngine, where module fetches are subject
       to CORS and would fail. Each file is an IIFE that extends window.ASM. -->
  <script src="js/core/util.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/theme.js"></script>
  <script src="js/ui/feedback.js"></script>
  <script src="js/ui/components.js"></script>
  <script src="js/ui/charts.js"></script>
  <script src="js/views/journey.js"></script>
  <script src="js/views/summary.js"></script>
  <script src="js/views/overview.js"></script>
  <script src="js/views/activity.js"></script>
  <script src="js/views/sidebar.js"></script>
  <script src="js/views/session.js"></script>
  <script src="js/views/cleanup.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/monitor.js"></script>
  <script src="js/views/tune.js"></script>
  <script src="js/views/misc.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
